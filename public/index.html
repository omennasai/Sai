<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Sai Mini Games</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#0b0d12;color:#fff;font-family:system-ui,sans-serif;overflow:hidden;touch-action:none}button,input{font:inherit}#ui{position:fixed;inset:0;display:grid;place-items:center;z-index:20;background:#0b0d12}.panel{width:min(92vw,430px);padding:22px;border:1px solid #394050;border-radius:18px;background:#171b24}input,button{width:100%;padding:12px;border:1px solid #41495b;border-radius:11px;background:#242a36;color:#fff;font-size:16px}button{margin-top:9px;background:#f4f4f4;color:#111;font-weight:800}.row{display:flex;gap:8px;margin-top:9px}.row>*{flex:1;margin:0}#status{min-height:20px;margin-top:9px;color:#ffadad;font-size:13px}#game{width:100vw;height:100dvh;display:block;background:#080a0e}#topbar{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:8;padding:7px 12px;border-radius:99px;background:#000b;font-size:12px;white-space:nowrap}#startBtn{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:9;width:150px;display:none}.action{position:fixed;bottom:22px;z-index:9;width:82px;height:58px;border-radius:18px;margin:0;display:none}.jump{right:112px}.shove{right:20px}#joy{position:fixed;left:20px;bottom:18px;width:125px;height:125px;border-radius:50%;background:#ffffff16;border:2px solid #ffffff38;z-index:9;display:none}#knob{position:absolute;left:38px;top:38px;width:49px;height:49px;border-radius:50%;background:#ffffffaa}#chatToggle{position:fixed;right:12px;top:48px;z-index:11;width:68px;padding:8px;margin:0;background:#111e;color:#fff;display:none}#chat{position:fixed;right:12px;top:88px;width:min(300px,42vw);z-index:10;background:#000e;border:1px solid #ffffff25;border-radius:12px;padding:8px;display:none}#chatLog{height:110px;overflow-y:auto;touch-action:pan-y;font-size:12px}#chatForm{display:flex;gap:5px}#chatInput{min-width:0;padding:7px;font-size:13px}#chatSend{width:55px;padding:7px;margin:0;font-size:12px}#net{position:fixed;left:8px;top:8px;z-index:8;background:#000a;border-radius:9px;padding:6px 8px;font-size:11px;line-height:1.45}#banner{position:fixed;left:50%;top:18%;transform:translateX(-50%);z-index:12;font-weight:900;font-size:clamp(25px,6vw,54px);text-shadow:0 3px 12px #000;pointer-events:none;text-align:center}#result{position:fixed;inset:0;display:none;place-items:center;z-index:15;background:#0009;font-size:34px;font-weight:900;text-align:center}.small{font-size:13px;color:#aaa;font-weight:500}@media(max-width:700px) and (orientation:portrait){#chat{width:calc(100vw - 24px);top:88px}.action{width:72px}.jump{right:94px}.shove{right:12px}}
</style></head><body>
<div id="ui"><div class="panel"><h2 style="margin:0 0 6px">Sai Mini Games</h2><div style="color:#aaa;font-size:13px;margin-bottom:15px">첫 게임: 떨어지는 발판</div><input id="name" maxlength="12" placeholder="닉네임"><button id="create">방 만들기</button><div class="row"><input id="code" maxlength="4" placeholder="방 코드"><button id="join">입장</button></div><div id="status"></div></div></div>
<canvas id="game" width="900" height="600"></canvas><div id="topbar">서버 연결 중...</div><div id="net">PING --<br>FPS --<br>SYNC --</div><div id="banner"></div><button id="startBtn">게임 시작</button><div id="joy"><div id="knob"></div></div><button id="jumpBtn" class="action jump">점프</button><button id="shoveBtn" class="action shove">밀치기</button><button id="chatToggle">채팅</button><div id="chat"><div id="chatLog"></div><form id="chatForm"><input id="chatInput" maxlength="200"><button id="chatSend">전송</button></form></div><div id="result"></div>
<script>
const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d'),ui=$('ui'),statusEl=$('status'),topbar=$('topbar'),net=$('net'),banner=$('banner'),result=$('result'),joy=$('joy'),knob=$('knob'),jumpBtn=$('jumpBtn'),shoveBtn=$('shoveBtn'),startBtn=$('startBtn'),chat=$('chat'),chatLog=$('chatLog'),chatInput=$('chatInput'),nameInput=$('name'),codeInput=$('code');
const touch=('ontouchstart'in window)||navigator.maxTouchPoints>0,protocol=location.protocol==='https:'?'wss':'ws',GRID=12,TILE_MS=1500;let ws,myId=null,roomCode=sessionStorage.getItem('roomCode'),sessionToken=sessionStorage.getItem('sessionToken'),playerName=sessionStorage.getItem('playerName')||'Player',phase='lobby',winner=null,introEndsAt=0,ping=null,syncDelay=null,lastNetMove=0,chatOpen=false,reconnectAttempts=0,reconnectTimer,pingTimer;nameInput.value=playerName;const players=new Map(),tiles=new Map(),keys={};let joyX=0,joyY=0,joyId=null,last=performance.now(),sendAcc=0,fps=0,frames=0,fpsAt=performance.now();
function send(d){if(ws&&ws.readyState===1){ws.send(JSON.stringify(d));return true}return false}function save(){if(roomCode)sessionStorage.setItem('roomCode',roomCode);if(sessionToken)sessionStorage.setItem('sessionToken',sessionToken);sessionStorage.setItem('playerName',playerName)}function clearSession(){sessionStorage.removeItem('roomCode');sessionStorage.removeItem('sessionToken');roomCode=sessionToken=null}function status(){const n=[...players.values()].filter(p=>p.connected!==false).length;topbar.textContent=roomCode?`방 ${roomCode} · ${n}/2 · ${phase==='lobby'?'대기실':phase==='intro'?'준비':'게임 중'}`:'서버 연결됨'}function controls(){const me=players.get(myId),play=phase==='playing'&&me&&me.alive;startBtn.style.display=phase==='lobby'&&me&&me.host?'block':'none';if(touch){joy.style.display=play?'block':'none';jumpBtn.style.display=play?'block':'none';shoveBtn.style.display=play?'block':'none'}else joy.style.display='none'}
function applyPlayers(list){const keep=new Set();(list||[]).forEach(p=>{const old=players.get(p.id)||{};players.set(p.id,{...old,...p});keep.add(p.id)});for(const id of players.keys())if(!keep.has(id))players.delete(id);status();controls()}
function gameState(g){if(!g)return;phase=g.phase||'lobby';introEndsAt=g.introEndsAt||0;winner=g.winner||null;tiles.clear();for(const [k,v] of Object.entries(g.tiles||{}))tiles.set(k,v);applyPlayers(g.players||[]);if(phase==='ended')showResult();else result.style.display='none'}
function addChat(m){const d=document.createElement('div');d.textContent=(m.name||'Player')+': '+(m.text||'');d.style.marginBottom='5px';chatLog.appendChild(d);while(chatLog.children.length>50)chatLog.firstChild.remove();chatLog.scrollTop=chatLog.scrollHeight}
function showResult(){const p=players.get(winner);result.innerHTML=(p?`${p.name} 승리!`:'무승부!')+'<div class="small">방장은 게임 시작을 눌러 다시 플레이할 수 있어요</div>';result.style.display='grid';setTimeout(()=>{result.style.display='none';phase='lobby';controls();status()},4000)}
function message(m){if(m.type==='pong'){ping=Math.max(0,Date.now()-Number(m.sentAt||Date.now()));return}if(m.type==='error'){statusEl.textContent=m.message;return}if(m.type==='resume_failed'){clearSession();ui.style.display='grid';return}if(m.type==='joined'){myId=m.id;roomCode=m.roomCode;sessionToken=m.sessionToken;playerName=nameInput.value.trim()||playerName;save();ui.style.display='none';$('chatToggle').style.display='block';chatLog.innerHTML='';(m.chatHistory||[]).forEach(addChat);applyPlayers(m.players);gameState(m.game);return}if(m.type==='players'){applyPlayers(m.players);return}if(m.type==='game_state'){phase=m.phase;introEndsAt=m.introEndsAt;winner=m.winner;tiles.clear();for(const[k,v]of Object.entries(m.tiles||{}))tiles.set(k,v);applyPlayers(m.players);result.style.display='none';controls();return}if(m.type==='game_start'){phase='playing';applyPlayers(m.players);banner.textContent='START!';setTimeout(()=>banner.textContent='',700);controls();return}if(m.type==='player_move'){const p=players.get(m.id);if(p){p.x=m.x;p.y=m.y;p.dirX=m.dirX;p.dirY=m.dirY;p.jumpUntil=m.jumpUntil||p.jumpUntil;syncDelay=Date.now()-lastNetMove;lastNetMove=Date.now()}return}if(m.type==='tile_trigger'){tiles.set(m.x+','+m.y,m.at);return}if(m.type==='tile_gone')return;if(m.type==='jump'){const p=players.get(m.id);if(p)p.jumpUntil=m.until;return}if(m.type==='shoved'){const p=players.get(m.id);if(p){p.x=m.x;p.y=m.y}return}if(m.type==='player_out'){const p=players.get(m.id);if(p)p.alive=false;controls();return}if(m.type==='game_over'){winner=m.winner;applyPlayers(m.players);phase='ended';controls();showResult();return}if(m.type==='chat')addChat(m)}
function connect(){if(ws&&(ws.readyState===0||ws.readyState===1))return;ws=new WebSocket(`${protocol}://${location.host}`);ws.onopen=()=>{reconnectAttempts=0;clearInterval(pingTimer);pingTimer=setInterval(()=>send({type:'ping',sentAt:Date.now()}),1500);send({type:'ping',sentAt:Date.now()});if(roomCode&&sessionToken)send({type:'resume_room',roomCode,sessionToken});else status()};ws.onmessage=e=>{try{message(JSON.parse(e.data))}catch{}};ws.onclose=()=>{clearInterval(pingTimer);ping=null;if(roomCode){topbar.textContent='재연결 중...';reconnectTimer=setTimeout(connect,Math.min(1000+(++reconnectAttempts)*500,4000))}}}connect();
$('create').onclick=()=>{playerName=nameInput.value.trim()||'Player';clearSession();save();send({type:'create_room',name:playerName})};$('join').onclick=()=>{const c=codeInput.value.trim().toUpperCase();if(!c)return statusEl.textContent='방 코드를 입력해줘.';playerName=nameInput.value.trim()||'Player';clearSession();save();send({type:'join_room',roomCode:c,name:playerName})};codeInput.oninput=()=>codeInput.value=codeInput.value.toUpperCase().replace(/[^A-Z0-9]/g,'');startBtn.onclick=()=>send({type:'start_game'});$('chatToggle').onclick=()=>{chatOpen=!chatOpen;chat.style.display=chatOpen?'block':'none';$('chatToggle').textContent=chatOpen?'닫기':'채팅'};$('chatForm').onsubmit=e=>{e.preventDefault();const t=chatInput.value.trim();if(t&&send({type:'chat',text:t}))chatInput.value=''};
function jump(){send({type:'jump'})}function shove(){send({type:'shove'})}jumpBtn.onpointerdown=e=>{e.preventDefault();jump()};shoveBtn.onpointerdown=e=>{e.preventDefault();shove()};addEventListener('keydown',e=>{if([chatInput,nameInput,codeInput].includes(document.activeElement))return;const k=e.key.toLowerCase();if(!keys[k]){if(k===' ')jump();if(k==='e')shove()}keys[k]=true;if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function setJoy(e){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy,d=Math.hypot(dx,dy)||1,max=38;if(d>max){dx*=max/d;dy*=max/d}joyX=dx/max;joyY=dy/max;knob.style.transform=`translate(${dx}px,${dy}px)`}joy.onpointerdown=e=>{joyId=e.pointerId;joy.setPointerCapture(e.pointerId);setJoy(e)};joy.onpointermove=e=>{if(e.pointerId===joyId)setJoy(e)};function endJoy(e){if(e.pointerId===joyId){joyId=null;joyX=joyY=0;knob.style.transform='translate(0,0)'}}joy.onpointerup=endJoy;joy.onpointercancel=endJoy;
function resize(){const d=devicePixelRatio||1;canvas.width=innerWidth*d;canvas.height=innerHeight*d;canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';ctx.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();
function drawPerson(p,cx,cy,s,side=false){const jumping=Date.now()<(p.jumpUntil||0),lift=jumping?Math.sin(Math.PI*Math.min(1,Math.max(0,1-(p.jumpUntil-Date.now())/600)))*10:0;cy-=lift;ctx.save();ctx.globalAlpha=p.connected===false?.35:1;ctx.strokeStyle=p.id===myId?'#70b7ff':'#ff7373';ctx.fillStyle=ctx.strokeStyle;ctx.lineWidth=Math.max(2,s*.09);ctx.lineCap='round';if(side){ctx.beginPath();ctx.arc(cx,cy-s*.45,s*.18,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.moveTo(cx,cy-s*.25);ctx.lineTo(cx,cy+s*.18);ctx.moveTo(cx,cy-s*.1);ctx.lineTo(cx+s*.27,cy+s*.02);ctx.moveTo(cx,cy+s*.18);ctx.lineTo(cx-s*.18,cy+s*.48);ctx.moveTo(cx,cy+s*.18);ctx.lineTo(cx+s*.2,cy+s*.48);ctx.stroke()}else{ctx.beginPath();ctx.arc(cx,cy,s*.23,0,Math.PI*2);ctx.fill();const dx=p.dirX||0,dy=p.dirY||1;ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+dx*s*.34,cy+dy*s*.34);ctx.stroke()}ctx.fillStyle='#fff';ctx.font=`${Math.max(11,s*.38)}px system-ui`;ctx.textAlign='center';ctx.fillText(p.name||'Player',cx,cy-s*.72);ctx.restore()}
function render(now){const W=innerWidth,H=innerHeight;ctx.clearRect(0,0,W,H);ctx.fillStyle='#0b0d12';ctx.fillRect(0,0,W,H);const size=Math.min(W*.72,H*.84),cell=size/GRID,ox=(W-size)/2,oy=(H-size)/2;const intro=phase==='intro';if(intro){const left=Math.max(0,Math.ceil((introEndsAt-Date.now())/1000));banner.textContent=left?String(left):'준비!'}else if(banner.textContent!=='START!')banner.textContent='';for(let y=0;y<GRID;y++)for(let x=0;x<GRID;x++){const k=x+','+y,t=tiles.get(k),age=t?Date.now()-t:0;if(t&&age>=TILE_MS)continue;let fill='#687080';if(t){if(age<500)fill='#e8c842';else if(age<1000)fill='#e58a32';else fill='#d94b4b'}ctx.fillStyle=fill;ctx.fillRect(ox+x*cell+1,oy+y*cell+1,cell-2,cell-2);ctx.strokeStyle='#ffffff18';ctx.strokeRect(ox+x*cell+1,oy+y*cell+1,cell-2,cell-2)}for(const p of players.values()){if(p.alive===false)continue;const px=ox+(p.x+.5)*cell,py=oy+(p.y+.5)*cell;drawPerson(p,px,py,cell*.55,intro)}frames++;if(now-fpsAt>500){fps=Math.round(frames*1000/(now-fpsAt));frames=0;fpsAt=now}net.innerHTML=`PING ${ping??'--'}ms<br>FPS ${fps||'--'}<br>SYNC ${syncDelay??'--'}ms`;requestAnimationFrame(render)}requestAnimationFrame(render);
function update(now){const dt=Math.min(.033,(now-last)/1000);last=now;const me=players.get(myId);if(phase==='playing'&&me&&me.alive){let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+joyX,dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0)+joyY,l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l}if(l>.02){me.x=Math.max(-.4,Math.min(GRID-.6,me.x+dx*3.2*dt));me.y=Math.max(-.4,Math.min(GRID-.6,me.y+dy*3.2*dt));me.dirX=dx;me.dirY=dy}sendAcc+=dt;if(sendAcc>.05){sendAcc=0;send({type:'move',x:me.x,y:me.y})}}requestAnimationFrame(update)}requestAnimationFrame(update);addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&(!ws||ws.readyState!==1))connect()});addEventListener('online',connect);
</script></body></html>
